<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./css/playground.css">
</head>

<body>
  <header>
    <div class="brand">
  Playground
  <span>練習用エディター</span>

  <a class="resource-btn" href="./learn.html?view=resources">
    リソース
  </a>
</div>
    <div class="lang-tabs" aria-label="言語">
      <button class="lang-tab" data-lang="html" type="button">HTML</button>
      <button class="lang-tab active" data-lang="js" type="button">JavaScript</button>
      <button class="lang-tab" data-lang="py" type="button">Python</button>
    </div>

    <div class="actions">
      <button class="btn" id="clear-btn" type="button">クリア</button>
      <button class="btn primary" id="run-btn" type="button">実行 (Ctrl+Enter)</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-label">
        <span id="code-label">CODE · JavaScript</span>
      </div>

      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
    </section>

    <section class="pane">
      <div class="pane-label">
        <div class="output-tabs">
          <button class="output-tab active" id="console-tab" type="button">CONSOLE</button>
          <button class="output-tab hidden" id="view-tab" type="button">VIEW</button>
        </div>

        <span class="html-view-note hidden" id="html-view-note">
          HTML / CSSをリアルタイム表示
        </span>
      </div>

      <div class="output-area">
        <div class="output-panel active" id="console-panel">
          <div id="console">
            <div class="muted">ここに出力が表示されます</div>
          </div>
        </div>

        <div class="output-panel" id="view-panel">
          <iframe
            id="html-view"
            title="HTML Preview"
            sandbox="allow-same-origin"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a href="./index.html">← レッスンに戻る</a>
    · HTML / JavaScript / Python
    · HTML / CSSはVIEWにリアルタイム表示
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <script src="./js/playground.js"></script>
</body>
</html>
