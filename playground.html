<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f5f7;
      --border: #e2e5eb;
      --text: #1a1d26;
      --muted: #6b7280;
      --primary: #2563eb;
      --code-bg: #0d1117;
      --code-text: #e6edf3;
      --prompt: #7ee787;
      --error: #b91c1c;
      --font: Inter, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.25rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .brand span { color: var(--muted); font-weight: 400; margin-left: 0.5rem; font-size: 0.8rem; }
    .lang-tabs {
      display: flex;
      gap: 0.2rem;
      background: #f3f4f6;
      padding: 0.2rem;
      border-radius: 8px;
    }
    .lang-tab {
      border: none;
      background: transparent;
      padding: 0.35rem 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    .lang-tab.active {
      background: #fff;
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    button.btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      font-weight: 500;
    }
    button.btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.btn:hover { filter: brightness(0.97); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--border);
      background: #fff;
    }
    .pane:last-child { border-right: none; }
    .pane-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      padding: 0.5rem 0.85rem;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
      letter-spacing: 0.03em;
    }
    .editor-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--code-bg);
    }
    .editor-wrap::before {
      content: "❯";
      position: absolute;
      left: 0.85rem;
      top: 0.9rem;
      color: var(--prompt);
      font-family: var(--mono);
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 1;
      line-height: 1.65;
    }
    #editor {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      background: var(--code-bg);
      color: var(--code-text);
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.65;
      padding: 0.9rem 1rem 1rem 2.5rem;
      caret-color: var(--prompt);
      tab-size: 2;
    }
    #console {
      flex: 1;
      overflow: auto;
      padding: 0.85rem 1rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.55;
      background: #fafafa;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #console .line { margin-bottom: 0.15rem; }
    #console .error { color: var(--error); }
    #console .muted { color: var(--muted); }
    footer {
      padding: 0.4rem 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: #fff;
      border-top: 1px solid var(--border);
    }
    a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Playground <span>練習用エディター</span></div>
    <div class="lang-tabs">
      <button class="lang-tab active" data-lang="js">JavaScript</button>
      <button class="lang-tab" data-lang="py">Python</button>
    </div>
    <div class="actions">
      <button class="btn" id="clear-btn">クリア</button>
      <button class="btn primary" id="run-btn">実行 (Ctrl+Enter)</button>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-label">CODE</div>
      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
    </section>
    <section class="pane">
      <div class="pane-label">CONSOLE</div>
      <div id="console"><div class="muted">ここに出力が表示されます</div></div>
    </section>
  </main>

  <footer>
    <a href="index.html">← レッスンに戻る</a>
    · 判定・ヒントなし · 入力中も Console に反映
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <script>
    let lang = "js";
    let timer = null;
    let running = false;

    const samples = {
      js: 'console.log("Hello");\n',
      py: 'print("Hello")\n'
    };

    const editor = document.getElementById("editor");
    const consoleEl = document.getElementById("console");

    editor.value = samples.js;

    function setLang(next) {
      lang = next;
      document.querySelectorAll(".lang-tab").forEach((t) => {
        t.classList.toggle("active", t.dataset.lang === lang);
      });
      editor.value = samples[lang];
      updateConsole();
    }

    document.querySelectorAll(".lang-tab").forEach((btn) => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    function captureConsole(fn) {
      const logs = [];
      const o = { log: console.log, error: console.error, warn: console.warn, info: console.info };
      console.log = (...a) => { logs.push({ type: "log", text: a.map(String).join(" ") }); o.log(...a); };
      console.error = (...a) => { logs.push({ type: "error", text: a.map(String).join(" ") }); o.error(...a); };
      console.warn = (...a) => { logs.push({ type: "log", text: a.map(String).join(" ") }); o.warn(...a); };
      console.info = (...a) => { logs.push({ type: "log", text: a.map(String).join(" ") }); o.info(...a); };
      let err = null;
      try { fn(); } catch (e) { err = e; }
      Object.assign(console, o);
      return { logs, err };
    }

    function runPython(code) {
      return new Promise((resolve) => {
        if (typeof Sk === "undefined") {
          resolve({ stdout: "", error: "Python engine not loaded" });
          return;
        }
        let stdout = "";
        Sk.configure({
          output: (t) => { stdout += t; },
          read: (x) => {
            if (!Sk.builtinFiles || !Sk.builtinFiles["files"][x]) throw "File not found: " + x;
            return Sk.builtinFiles["files"][x];
          },
          __future__: Sk.python3
        });
        Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
          .then(() => resolve({ stdout, error: null }))
          .catch((e) => resolve({ stdout, error: e.toString() }));
      });
    }

    async function updateConsole() {
      if (running) return;
      running = true;
      const code = editor.value;
      try {
        if (lang === "py") {
          const r = await runPython(code);
          let html = "";
          if (r.stdout) {
            html += r.stdout.split("\n").filter((l) => l.length).map((l) =>
              '<div class="line">' + escapeHtml(l) + "</div>"
            ).join("");
          }
          if (r.error) html += '<div class="line error">' + escapeHtml(r.error) + "</div>";
          consoleEl.innerHTML = html || '<div class="muted">（出力なし）</div>';
        } else {
          const { logs, err } = captureConsole(() => { new Function(code)(); });
          let html = logs.map((l) =>
            '<div class="line' + (l.type === "error" ? " error" : "") + '">' + escapeHtml(l.text) + "</div>"
          ).join("");
          if (err) html += '<div class="line error">' + escapeHtml(err.message || String(err)) + "</div>";
          consoleEl.innerHTML = html || '<div class="muted">（出力なし）</div>';
        }
      } catch (e) {
        consoleEl.innerHTML = '<div class="line error">' + escapeHtml(e.message || String(e)) + "</div>";
      } finally {
        running = false;
      }
    }

    function schedule() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(updateConsole, lang === "py" ? 500 : 300);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    editor.addEventListener("input", schedule);
    document.getElementById("run-btn").addEventListener("click", updateConsole);
    document.getElementById("clear-btn").addEventListener("click", () => {
      editor.value = "";
      updateConsole();
      editor.focus();
    });
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        updateConsole();
      }
    });

    updateConsole();
  </script>
</body>
</html>
